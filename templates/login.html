<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Masuk</title>
  </head>
  <body>
    <h1>Masuk</h1>

    <form method="post">
      <p>
        <label for="email">Email</label><br>
        <input id="email" name="email" type="email" placeholder="Masukkan email Anda" required>
      </p>
      <p>
        <label for="sandi">Sandi</label><br>
        <input id="sandi" name="sandi" type="password" placeholder="Masukkan kata sandi Anda" required>
      </p>
      <button type="submit">Masuk</button>
    </form>

    {% if pesan %}
      <p>{{ pesan }}</p>
    {% endif %}
  </body>
</html>
