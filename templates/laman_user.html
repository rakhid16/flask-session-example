<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Pengguna</title>
  </head>
  <body>
    <h1>Selamat datang, {{ data.username }}!</h1>

    <dl>
      <dt>Email</dt>
      <dd>{{ data.email }}</dd>
      <dt>Username</dt>
      <dd>{{ data.username }}</dd>
      <dt>Alamat</dt>
      <dd>{{ data.alamat }}</dd>
      <dt>Sandi</dt>
      <dd>{{ data.sandi }}</dd>
    </dl>

    <p>
      <a href="{{ url_for('user_edit_data', id=data._id) }}">Edit data</a>
      <a href="{{ url_for('user_hapus_akun', id=data._id) }}">Hapus akun</a>
    </p>
    <p><a href="{{ url_for('logout') }}">Keluar</a></p>
  </body>
</html>
